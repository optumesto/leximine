# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom did not support Gradle's configuration cache until well after the 1.6
# line, which is the line that still targets 1.20.4. Leave it off.
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------
# BUILDING THIS YOURSELF? Change or delete the next line -- it is a path on
# one particular machine and Gradle will refuse to start if it does not exist
# on yours. You need any JDK 21; point this at yours, or delete the line and
# make sure `java -version` already says 21.
#
# It is here because this machine has Java 8 first on PATH and something else
# on it depends on that, so the JDK is pinned per-project rather than by
# changing the system PATH or JAVA_HOME. Forward slashes on purpose: in a
# .properties file a backslash is an escape character.
# ---------------------------------------------------------------------
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot

# Fabric properties -- check these against https://fabricmc.net/develop
minecraft_version=1.20.4
loader_version=0.20.1
# NOT the version from fabricmc.net/develop. That page now serves Loom 1.19,
# which requires a Java 25 JVM to run Gradle -- and Minecraft 1.20.4 predates
# Java 25 by two years, so runClient would be launching the game on a JVM it
# was never built for. The 1.6 line is the one contemporary with 1.20.4:
# Gradle 8.6, Java 17+, and a runClient that matches what players actually run.
loom_version=1.6-SNAPSHOT

# Yarn rather than Mojang's official mappings. Mojang names the method we need
# `Inventory.add`; Yarn calls it `insertStack`, which is what every Fabric
# tutorial and almost all community code uses. Easier to read and to look up.
yarn_mappings=1.20.4+build.3

# Mod properties
version=0.1.0
maven_group=dev.mettle
archives_base_name=leximine

# Dependencies
fabric_api_version=0.97.3+1.20.4
java_websocket_version=1.6.0
